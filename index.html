<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Mega Avtosalon (60+ Mashina)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #0d0e12;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        /* Boshqaruv Paneli (UI) */
        .ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(20, 22, 30, 0.85);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 280px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        h2 { margin: 0 0 10px 0; font-size: 18px; color: #00f2fe; }
        .control-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; margin-bottom: 5px; color: #aaa; }
        select, input[type="range"], input[type="color"] {
            width: 100%;
            background: #1a1c23;
            border: 1px solid #333;
            color: white;
            padding: 8px;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .stats {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 12px;
            color: #666;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-panel">
        <h2>🏎️ Avto Configurator</h2>
        
        <div class="control-group">
            <label>Mashina Modeli (1 dan 60 gacha):</label>
            <select id="carSelector"></select>
        </div>

        <div class="control-group">
            <label>Kuzov Rangi:</label>
            <input type="color" id="carColor" value="#ff0044">
        </div>

        <div class="control-group">
            <label>Spoyler Turi:</label>
            <select id="spoilerType">
                <option value="none">Yo'q</option>
                <option value="sport">Sport Spoyler</option>
                <option value="GT">GT Katta Spoyler</option>
            </select>
        </div>

        <div class="control-group">
            <label>G'ildirak Hajmi:</label>
            <input type="range" id="wheelSize" min="0.7" max="1.3" step="0.05" value="1">
        </div>

        <div class="control-group">
            <label>Klirens (Balandlik):</label>
            <input type="range" id="suspensionHeight" min="0.3" max="0.8" step="0.05" value="0.5">
        </div>
    </div>

    <div class="stats">3D Injinerlik Rejimi | Pure JavaScript Code</div>

    <script>
        // 1. Sahnani tayyorlash
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0d0e12, 0.03);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 3, 7);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2 - 0.05; // Yerdan pastga tushib ketmaslik uchun

        // 2. Yoritish (Studio Lighting)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
        mainLight.position.set(10, 20, 10);
        mainLight.castShadow = true;
        scene.add(mainLight);

        const blueLight = new THREE.PointLight(0x00f2fe, 1, 10);
        blueLight.position.set(-5, 2, -5);
        scene.add(blueLight);

        // Pol (Shouroom pol)
        const floorGeo = new THREE.PlaneGeometry(100, 100);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x111318, roughness: 0.2, metalness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Grid (To'r liniyalari)
        const grid = new THREE.GridHelper(100, 50, 0x00f2fe, 0x222530);
        grid.position.y = 0.01;
        scene.add(grid);

        // 3. 60 xil mashina generatori
        let currentCarGroup = new THREE.Group();
        scene.add(currentCarGroup);

        const carSelector = document.getElementById('carSelector');
        for (let i = 1; i <= 60; i++) {
            const opt = document.createElement('option');
            opt.value = i;
            opt.innerText = `Model #${i} ${i > 40 ? '(Hypercar)' : i > 20 ? '(SUV/Offroad)' : '(Sport)'}`;
            carSelector.appendChild(opt);
        }

        // Procedural Mashina Yaratuvchi Funktsiya
        function buildCar(id) {
            scene.remove(currentCarGroup);
            currentCarGroup = new THREE.Group();

            // ID ga qarab shakllarni algoritmik o'zgartirish
            const seed = id * 123.45;
            const length = 2.2 + (id % 5) * 0.2;
            const height = 0.6 + (id % 3) * 0.2;
            const width = 1.2 + (id % 4) * 0.1;

            const carColor = document.getElementById('carColor').value;
            const bodyMat = new THREE.MeshStandardMaterial({ color: carColor, metalness: 0.8, roughness: 0.2 });
            const glassMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1, transmission: 0.9 });
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.5 });
            const chromeMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 1, roughness: 0.1 });

            // Kuzov (Body)
            const bodyGeo = new THREE.BoxGeometry(width, height, length);
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = height / 2 + 0.3;
            body.castShadow = true;
            currentCarGroup.add(body);

            // Kabina (Top)
            const cabinLength = length * 0.5;
            const cabinGeo = new THREE.BoxGeometry(width * 0.85, height * 0.7, cabinLength);
            const cabin = new THREE.Mesh(cabinGeo, glassMat);
            cabin.position.set(0, height + 0.2, -0.1);
            cabin.castShadow = true;
            currentCarGroup.add(cabin);

            // G'ildiraklar
            const wheelRadius = parseFloat(document.getElementById('wheelSize').value) * 0.3;
            const wheelGeo = new THREE.CylinderGeometry(wheelRadius, wheelRadius, 0.2, 24);
            wheelGeo.rotateZ(Math.PI / 2);

            const suspY = parseFloat(document.getElementById('suspensionHeight').value);
            const wheelPositions = [
                [-width/2 - 0.1, suspY, length/2 - 0.4],
                [width/2 + 0.1, suspY, length/2 - 0.4],
                [-width/2 - 0.1, suspY, -length/2 + 0.4],
                [width/2 + 0.1, suspY, -length/2 + 0.4]
            ];

            wheelPositions.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.position.set(...pos);
                wheel.castShadow = true;
                
                // Disk
                const rimGeo = new THREE.CylinderGeometry(wheelRadius*0.6, wheelRadius*0.6, 0.21, 12);
                rimGeo.rotateZ(Math.PI / 2);
                const rim = new THREE.Mesh(rimGeo, chromeMat);
                wheel.add(rim);

                currentCarGroup.add(wheel);
            });

            // Spoyler
            const spoilerType = document.getElementById('spoilerType').value;
            if (spoilerType !== 'none') {
                const wingWidth = spoilerType === 'GT' ? width * 1.2 : width * 0.9;
                const wingGeo = new THREE.BoxGeometry(wingWidth, 0.05, 0.3);
                const wing = new THREE.Mesh(wingGeo, bodyMat);
                wing.position.set(0, height + 0.6, -length/2 + 0.2);
                
                // Ustunlar
                const legGeo = new THREE.BoxGeometry(0.05, 0.3, 0.05);
                const leg1 = new THREE.Mesh(legGeo, chromeMat);
                leg1.position.set(-width/3, height + 0.4, -length/2 + 0.2);
                const leg2 = leg1.clone();
                leg2.position.x = width/3;

                currentCarGroup.add(wing, leg1, leg2);
            }

            // Farlar (Headlights)
            const lightGeo = new THREE.BoxGeometry(0.3, 0.1, 0.1);
            const lightMat = new THREE.MeshBasicMaterial({ color: 0x00f2fe });
            const lightL = new THREE.Mesh(lightGeo, lightMat);
            lightL.position.set(-width/3, height/2 + 0.3, length/2 + 0.01);
            const lightR = lightL.clone();
            lightR.position.x = width/3;
            currentCarGroup.add(lightL, lightR);

            scene.add(currentCarGroup);
        }

        // Boshlang'ich mashinani yuklash
        buildCar(1);

        // Event Listener'lar (Boshqaruv elementlari uchun)
        document.getElementById('carSelector').addEventListener('change', (e) => buildCar(e.target.value));
        document.getElementById('carColor').addEventListener('input', () => buildCar(carSelector.value));
        document.getElementById('spoilerType').addEventListener('change', () => buildCar(carSelector.value));
        document.getElementById('wheelSize').addEventListener('input', () => buildCar(carSelector.value));
        document.getElementById('suspensionHeight').addEventListener('input', () => buildCar(carSelector.value));

        // Oyna hajmi o'zgarganda rezolyutsiyani moslash
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animatsiya sikli
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
