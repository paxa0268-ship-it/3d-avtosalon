<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Pure JS 3D Hyper-Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { overflow: hidden; background: #030305; color: #fff; }
        #canvas-container { width: 100vw; height: 100vh; }

        /* Modern UI Panel */
        .ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 320px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            background: rgba(10, 12, 18, 0.88);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.9);
        }
        .ui-panel::-webkit-scrollbar { width: 4px; }
        .ui-panel::-webkit-scrollbar-thumb { background: #00f2fe; border-radius: 4px; }

        h2 { font-size: 20px; font-weight: 800; color: #00f2fe; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 2px; }
        p.desc { font-size: 11px; color: #666; margin-bottom: 18px; }

        .section { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: #00f2fe; margin: 16px 0 8px 0; font-weight: bold; border-bottom: 1px solid rgba(0,242,254,0.2); padding-bottom: 4px; }

        .control { margin-bottom: 12px; }
        label { display: block; font-size: 12px; color: #aaa; margin-bottom: 5px; }

        select, input[type="range"], input[type="color"] {
            width: 100%; background: #121520; border: 1px solid #252a3b;
            color: #fff; padding: 10px; border-radius: 8px; font-size: 13px;
            outline: none; transition: 0.3s;
        }
        select:focus, input:focus { border-color: #00f2fe; }

        .btn-rand {
            width: 100%; background: linear-gradient(135deg, #00f2fe, #4facfe);
            border: none; color: #000; font-weight: bold; padding: 12px;
            border-radius: 8px; cursor: pointer; margin-top: 15px;
            text-transform: uppercase; letter-spacing: 1px; transition: 0.3s;
        }
        .btn-rand:hover { opacity: 0.9; transform: translateY(-2px); }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-panel">
        <h2>🏎️ Pro Studio 3D</h2>
        <p class="desc">100% Pure JavaScript Procedural Engine</p>

        <div class="section">1. Kuzov & Bo'yoq</div>
        <div class="control">
            <label>Kuzov Rangi:</label>
            <input type="color" id="paintColor" value="#0a1931">
        </div>
        <div class="control">
            <label>Lak Yarqirashi (Clearcoat):</label>
            <input type="range" id="clearcoat" min="0" max="1" step="0.05" value="1">
        </div>

        <div class="section">2. Aerodinamika & Bumper</div>
        <div class="control">
            <label>Old Bamper Splitter:</label>
            <select id="frontSplitter">
                <option value="carbon">Carbon Fiber Aero</option>
                <option value="stock">Standard Factory</option>
            </select>
        </div>
        <div class="control">
            <label>Orqa Spoyler:</label>
            <select id="spoiler">
                <option value="gt">GT Carbon Wing</option>
                <option value="ducktail">Ducktail Lip</option>
                <option value="none">Yo'q</option>
            </select>
        </div>

        <div class="section">3. Diska & Tormozlar</div>
        <div class="control">
            <label>Diska Dizayni:</label>
            <select id="rimStyle">
                <option value="m_sport">BMW M-Style Multi-Spoke</option>
                <option value="star">5-Spoke Competition</option>
            </select>
        </div>
        <div class="control">
            <label>Tormoz Supporti (Caliper):</label>
            <input type="color" id="caliperColor" value="#ff0000">
        </div>
        <div class="control">
            <label>Diska Radiusi (R18 - R22):</label>
            <input type="range" id="rimRadius" min="0.8" max="1.3" step="0.05" value="1.05">
        </div>
        <div class="control">
            <label>Klirens (Pasadka):</label>
            <input type="range" id="rideHeight" min="0.15" max="0.5" step="0.02" value="0.25">
        </div>

        <div class="section">4. Effektlar & Neon</div>
        <div class="control">
            <label>Neon Tag Chiroqlari:</label>
            <input type="color" id="neonColor" value="#00f2fe">
        </div>

        <button class="btn-rand" id="randomize">🎲 Random Custom Tuning</button>
    </div>

    <script>
        // --- 1. SETUP SCENE, CAMERA & RENDERER ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x030305);
        scene.fog = new THREE.FogExp2(0x030305, 0.015);

        const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(6, 2, 7);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.3;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.01;
        controls.minDistance = 3;
        controls.maxDistance = 14;

        // --- 2. LIGHTING & SHOWROOM FLOOR ---
        const ambient = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambient);

        // Main Studio Spot Light
        const mainLight = new THREE.DirectionalLight(0xffffff, 1.8);
        mainLight.position.set(6, 12, 6);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        scene.add(mainLight);

        // Blue Back Rim Light
        const rimLight = new THREE.DirectionalLight(0x00f2fe, 1.5);
        rimLight.position.set(-6, 4, -6);
        scene.add(rimLight);

        // Showroom Floor
        const floorGeo = new THREE.PlaneGeometry(60, 60);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x07080c, roughness: 0.15, metalness: 0.85 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        const grid = new THREE.GridHelper(60, 30, 0x00f2fe, 0x111420);
        grid.position.y = 0.001;
        scene.add(grid);

        // Neon Light Under Car
        const neonLight = new THREE.PointLight(0x00f2fe, 3.5, 5);
        neonLight.position.set(0, 0.08, 0);
        scene.add(neonLight);

        // --- 3. PROCEDURAL HIGH-DETAIL MESH ENGINE ---
        let carGroup = new THREE.Group();
        scene.add(carGroup);

        function buildAdvancedCar() {
            scene.remove(carGroup);
            carGroup = new THREE.Group();

            // Values from UI
            const paintHex = document.getElementById('paintColor').value;
            const clearcoatVal = parseFloat(document.getElementById('clearcoat').value);
            const rimScale = parseFloat(document.getElementById('rimRadius').value);
            const rideH = parseFloat(document.getElementById('rideHeight').value);
            const caliperHex = document.getElementById('caliperColor').value;
            const frontSplitter = document.getElementById('frontSplitter').value;
            const spoilerStyle = document.getElementById('spoiler').value;
            const rimStyle = document.getElementById('rimStyle').value;

            // Advanced Materials
            const bodyMat = new THREE.MeshPhysicalMaterial({
                color: new THREE.Color(paintHex),
                metalness: 0.85,
                roughness: 0.15,
                clearcoat: clearcoatVal,
                clearcoatRoughness: 0.05
            });

            const carbonMat = new THREE.MeshStandardMaterial({ color: 0x111113, roughness: 0.3, metalness: 0.7 });
            const glassMat = new THREE.MeshPhysicalMaterial({ color: 0x020202, metalness: 0.1, roughness: 0, transmission: 0.95, transparent: true });
            const chromeMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 1.0, roughness: 0.05 });
            const brakeMat = new THREE.MeshStandardMaterial({ color: new THREE.Color(caliperHex), metalness: 0.5, roughness: 0.2 });
            const discMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.9, roughness: 0.3 });
            const tireMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.85 });

            const len = 4.5, w = 2.0, h = 0.85;

            // 1. MAIN BODY CHASSIS
            const mainBodyGeo = new THREE.BoxGeometry(w, h, len);
            const mainBody = new THREE.Mesh(mainBodyGeo, bodyMat);
            mainBody.position.y = h/2 + rideH;
            mainBody.castShadow = true;
            carGroup.add(mainBody);

            // 2. CABIN & GLASS
            const cabH = h * 0.75;
            const cabGeo = new THREE.BoxGeometry(w * 0.84, cabH, len * 0.45);
            const cabin = new THREE.Mesh(cabGeo, glassMat);
            cabin.position.set(0, h + cabH/2 + rideH - 0.08, -len * 0.05);
            carGroup.add(cabin);

            // 3. FRONT HOOD & BMW KIDNEY GRILLE
            const hoodGeo = new THREE.BoxGeometry(w * 0.82, 0.06, len * 0.32);
            const hood = new THREE.Mesh(hoodGeo, bodyMat);
            hood.position.set(0, h + rideH + 0.02, len * 0.25);
            carGroup.add(hood);

            // Grille Frame
            const grilleFrame = new THREE.Mesh(new THREE.BoxGeometry(w * 0.42, h * 0.3, 0.08), chromeMat);
            grilleFrame.position.set(0, rideH + h * 0.4, len / 2 + 0.04);
            carGroup.add(grilleFrame);

            // Grille Mesh
            const grilleMesh = new THREE.Mesh(new THREE.BoxGeometry(w * 0.38, h * 0.26, 0.09), carbonMat);
            grilleMesh.position.set(0, rideH + h * 0.4, len / 2 + 0.045);
            carGroup.add(grilleMesh);

            // 4. FRONT & REAR BUMPERS
            if (frontSplitter === 'carbon') {
                const splitter = new THREE.Mesh(new THREE.BoxGeometry(w * 1.05, 0.04, 0.4), carbonMat);
                splitter.position.set(0, rideH + 0.02, len / 2 + 0.15);
                carGroup.add(splitter);
            }

            // Rear Diffuser & Exhaust Pipes
            const diffuser = new THREE.Mesh(new THREE.BoxGeometry(w * 0.9, h * 0.3, 0.2), carbonMat);
            diffuser.position.set(0, rideH + h * 0.15, -len / 2 - 0.05);
            carGroup.add(diffuser);

            const exhaustGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.2, 16);
            exhaustGeo.rotateX(Math.PI / 2);
            const ex1 = new THREE.Mesh(exhaustGeo, chromeMat);
            ex1.position.set(-w * 0.3, rideH + h * 0.15, -len / 2 - 0.12);
            const ex2 = ex1.clone(); ex2.position.x = -w * 0.22;
            const ex3 = ex1.clone(); ex3.position.x = w * 0.22;
            const ex4 = ex1.clone(); ex4.position.x = w * 0.3;
            carGroup.add(ex1, ex2, ex3, ex4);

            // 5. LIGHTS (LED HEADLIGHTS & TAILLIGHTS)
            const headlightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const hlL = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.08, 0.1), headlightMat);
            hlL.position.set(-w * 0.28, rideH + h * 0.52, len / 2 + 0.02);
            const hlR = hlL.clone(); hlR.position.x = w * 0.28;
            carGroup.add(hlL, hlR);

            const tailMat = new THREE.MeshBasicMaterial({ color: 0xff0033 });
            const tailLight = new THREE.Mesh(new THREE.BoxGeometry(w * 0.85, 0.06, 0.05), tailMat);
            tailLight.position.set(0, rideH + h * 0.55, -len / 2 - 0.01);
            carGroup.add(tailLight);

            // 6. SPOILER
            if (spoilerStyle === 'gt') {
                const wing = new THREE.Mesh(new THREE.BoxGeometry(w * 1.1, 0.04, 0.28), carbonMat);
                wing.position.set(0, rideH + h + 0.35, -len / 2 + 0.2);
                
                const leg1 = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.3, 0.08), carbonMat);
                leg1.position.set(-w * 0.3, rideH + h + 0.15, -len / 2 + 0.2);
                const leg2 = leg1.clone(); leg2.position.x = w * 0.3;
                carGroup.add(wing, leg1, leg2);
            } else if (spoilerStyle === 'ducktail') {
                const duck = new THREE.Mesh(new THREE.BoxGeometry(w * 0.82, 0.08, 0.15), carbonMat);
                duck.position.set(0, rideH + h + 0.02, -len / 2 + 0.1);
                duck.rotation.x = -Math.PI / 8;
                carGroup.add(duck);
            }

            // 7. WHEELS & BRAKE CALIPERS
            const R = 0.36 * rimScale;
            const tireGeo = new THREE.CylinderGeometry(R, R, 0.24, 32);
            tireGeo.rotateZ(Math.PI / 2);

            const wheelPositions = [
                [-w / 2 - 0.04, rideH + R * 0.8, len * 0.3],
                [w / 2 + 0.04, rideH + R * 0.8, len * 0.3],
                [-w / 2 - 0.04, rideH + R * 0.8, -len * 0.3],
                [w / 2 + 0.04, rideH + R * 0.8, -len * 0.3]
            ];

            wheelPositions.forEach(pos => {
                const wheelGroup = new THREE.Group();
                
                // Rubber Tire
                const tire = new THREE.Mesh(tireGeo, tireMat);
                tire.castShadow = true;
                wheelGroup.add(tire);

                // Brake Disc & Caliper
                const discGeo = new THREE.CylinderGeometry(R * 0.68, R * 0.68, 0.05, 24);
                discGeo.rotateZ(Math.PI / 2);
                const disc = new THREE.Mesh(discGeo, discMat);
                
                const caliperGeo = new THREE.BoxGeometry(0.08, R * 0.4, R * 0.3);
                const caliper = new THREE.Mesh(caliperGeo, brakeMat);
                caliper.position.set(0, R * 0.35, 0);
                wheelGroup.add(disc, caliper);

                // Rim Design
                const rimCenter = new THREE.Mesh(new THREE.CylinderGeometry(R * 0.3, R * 0.3, 0.25, 16), chromeMat);
                rimCenter.rotateZ(Math.PI / 2);
                wheelGroup.add(rimCenter);

                const spokeCount = rimStyle === 'm_sport' ? 10 : 5;
                for (let i = 0; i < spokeCount; i++) {
                    const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.25, R * 0.8, 0.025), chromeMat);
                    spoke.rotation.x = (i * Math.PI * 2) / spokeCount;
                    wheelGroup.add(spoke);
                }

                wheelGroup.position.set(...pos);
                carGroup.add(wheelGroup);
            });

            // Update Neon Light Color
            neonLight.color = new THREE.Color(document.getElementById('neonColor').value);

            scene.add(carGroup);
        }

        // --- 4. LISTENERS & RANDOMIZER ---
        const uiElements = document.querySelectorAll('.ui-panel input, .ui-panel select');
        uiElements.forEach(el => el.addEventListener('input', buildAdvancedCar));

        document.getElementById('randomize').addEventListener('click', () => {
            document.getElementById('paintColor').value = '#' + Math.floor(Math.random()*16777215).toString(16);
            document.getElementById('caliperColor').value = '#' + Math.floor(Math.random()*16777215).toString(16);
            document.getElementById('neonColor').value = '#' + Math.floor(Math.random()*16777215).toString(16);
            document.getElementById('rimRadius').value = (Math.random() * (1.3 - 0.8) + 0.8).toFixed(2);
            document.getElementById('rideHeight').value = (Math.random() * (0.4 - 0.15) + 0.15).toFixed(2);
            buildAdvancedCar();
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Init
        buildAdvancedCar();

        // --- 5. ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
